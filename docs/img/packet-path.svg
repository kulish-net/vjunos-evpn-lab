<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="880" height="340" fill="#ffffff"/>

  <text x="440" y="30" text-anchor="middle" font-size="17" fill="#0f172a" font-weight="700">Где умирает пакет: три точки захвата</text>

  <!-- nodes -->
  <rect x="24" y="76" width="104" height="58" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="76" y="111" text-anchor="middle" font-size="15" fill="#0f172a" font-weight="600">h1</text>

  <rect x="206" y="66" width="138" height="78" rx="10" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="275" y="100" text-anchor="middle" font-size="15" fill="#0f172a" font-weight="700">leaf1</text>
  <text x="275" y="121" text-anchor="middle" font-size="11.5" fill="#16a34a">инкапсулирует</text>

  <rect x="536" y="66" width="138" height="78" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="605" y="100" text-anchor="middle" font-size="15" fill="#0f172a" font-weight="700">leaf2</text>
  <text x="605" y="121" text-anchor="middle" font-size="11.5" fill="#dc2626" font-weight="600">не разбирает</text>

  <rect x="752" y="76" width="104" height="58" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="804" y="111" text-anchor="middle" font-size="15" fill="#0f172a" font-weight="600">h2</text>

  <!-- links -->
  <line x1="128" y1="105" x2="206" y2="105" stroke="#0f172a" stroke-width="2"/>
  <line x1="344" y1="105" x2="536" y2="105" stroke="#0f172a" stroke-width="2"/>
  <line x1="674" y1="105" x2="752" y2="105" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- capture 1 -->
  <circle cx="378" cy="105" r="12" fill="#16a34a"/>
  <text x="378" y="110" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="700">1</text>
  <text x="378" y="166" text-anchor="middle" font-size="13" fill="#16a34a" font-weight="700">уходит &#10003;</text>
  <text x="378" y="186" text-anchor="middle" font-size="11" fill="#475569" font-family="ui-monospace, monospace">VXLAN, vni 10010</text>
  <text x="378" y="202" text-anchor="middle" font-size="11" fill="#475569" font-family="ui-monospace, monospace">ARP who-has 10.10.10.2</text>

  <!-- capture 2 -->
  <circle cx="502" cy="105" r="12" fill="#16a34a"/>
  <text x="502" y="110" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="700">2</text>
  <text x="560" y="232" text-anchor="middle" font-size="13" fill="#16a34a" font-weight="700">приходит &#10003;</text>
  <text x="560" y="250" text-anchor="middle" font-size="11" fill="#475569">тот же пакет, сеть ни при чём</text>

  <!-- capture 3 -->
  <circle cx="713" cy="105" r="12" fill="#dc2626"/>
  <text x="713" y="110" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="700">3</text>
  <text x="760" y="166" text-anchor="middle" font-size="13" fill="#dc2626" font-weight="700">ничего &#10007;</text>
  <text x="760" y="186" text-anchor="middle" font-size="11" fill="#475569" font-family="ui-monospace, monospace">0 packets captured</text>

  <!-- verdict, then the fix -->
  <rect x="140" y="266" width="600" height="28" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="440" y="285" text-anchor="middle" font-size="13" fill="#991b1b">Ни ошибки, ни записи в логе, ни единицы в счётчиках drops</text>

  <rect x="140" y="300" width="600" height="28" rx="7" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="440" y="319" text-anchor="middle" font-size="12.5" fill="#166534" font-family="ui-monospace, monospace">лечение: set forwarding-options tunnel-termination</text>
</svg>
