<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="880" height="390" fill="#ffffff"/>

  <!-- overlay arc, labels placed above its apex (y~98) -->
  <text x="440" y="36" text-anchor="middle" font-size="14" fill="#2563eb" font-weight="600">eBGP overlay: lo0 &#8596; lo0, family evpn signaling</text>
  <text x="440" y="56" text-anchor="middle" font-size="13" fill="#2563eb">поверх него туннель VXLAN, VNI 10010</text>
  <path d="M 265 160 C 265 76, 615 76, 615 160" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="7 5"/>

  <!-- hosts -->
  <rect x="24" y="188" width="118" height="62" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="83" y="213" text-anchor="middle" font-size="15" fill="#0f172a" font-weight="600">h1</text>
  <text x="83" y="233" text-anchor="middle" font-size="12.5" fill="#475569" font-family="ui-monospace, monospace">10.10.10.1/24</text>

  <rect x="738" y="188" width="118" height="62" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="797" y="213" text-anchor="middle" font-size="15" fill="#0f172a" font-weight="600">h2</text>
  <text x="797" y="233" text-anchor="middle" font-size="12.5" fill="#475569" font-family="ui-monospace, monospace">10.10.10.2/24</text>

  <!-- leaves -->
  <rect x="196" y="160" width="138" height="118" rx="10" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="265" y="186" text-anchor="middle" font-size="16" fill="#0f172a" font-weight="700">leaf1</text>
  <text x="265" y="206" text-anchor="middle" font-size="12" fill="#475569">PTX10001-36MR</text>
  <text x="265" y="229" text-anchor="middle" font-size="12.5" fill="#0f172a" font-family="ui-monospace, monospace">lo0 10.0.0.1/32</text>
  <text x="265" y="249" text-anchor="middle" font-size="12.5" fill="#0f172a" font-family="ui-monospace, monospace">AS 65001</text>
  <text x="265" y="268" text-anchor="middle" font-size="12" fill="#475569">MAC-VRF, VNI 10010</text>

  <rect x="546" y="160" width="138" height="118" rx="10" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="615" y="186" text-anchor="middle" font-size="16" fill="#0f172a" font-weight="700">leaf2</text>
  <text x="615" y="206" text-anchor="middle" font-size="12" fill="#475569">PTX10001-36MR</text>
  <text x="615" y="229" text-anchor="middle" font-size="12.5" fill="#0f172a" font-family="ui-monospace, monospace">lo0 10.0.0.2/32</text>
  <text x="615" y="249" text-anchor="middle" font-size="12.5" fill="#0f172a" font-family="ui-monospace, monospace">AS 65002</text>
  <text x="615" y="268" text-anchor="middle" font-size="12" fill="#475569">MAC-VRF, VNI 10010</text>

  <!-- access links -->
  <line x1="142" y1="219" x2="196" y2="219" stroke="#0f172a" stroke-width="2"/>
  <line x1="684" y1="219" x2="738" y2="219" stroke="#0f172a" stroke-width="2"/>
  <text x="169" y="210" text-anchor="middle" font-size="11" fill="#475569" font-family="ui-monospace, monospace">et-0/0/1</text>
  <text x="169" y="237" text-anchor="middle" font-size="11" fill="#475569">VLAN 10</text>
  <text x="711" y="210" text-anchor="middle" font-size="11" fill="#475569" font-family="ui-monospace, monospace">et-0/0/1</text>
  <text x="711" y="237" text-anchor="middle" font-size="11" fill="#475569">VLAN 10</text>

  <!-- underlay link -->
  <line x1="334" y1="219" x2="546" y2="219" stroke="#0f172a" stroke-width="2"/>
  <text x="440" y="200" text-anchor="middle" font-size="13" fill="#0f172a" font-weight="600">eBGP underlay</text>
  <text x="440" y="240" text-anchor="middle" font-size="12.5" fill="#475569" font-family="ui-monospace, monospace">et-0/0/0, 10.255.0.0/31</text>

  <!-- interface naming note -->
  <rect x="196" y="306" width="488" height="68" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="440" y="329" text-anchor="middle" font-size="13" fill="#92400e" font-weight="600">Имена живут в двух системах координат</text>
  <text x="440" y="350" text-anchor="middle" font-size="12.5" fill="#92400e" font-family="ui-monospace, monospace">топология: eth4, eth5 &#8594; конфиг: et-0/0/0, et-0/0/1</text>
  <text x="440" y="367" text-anchor="middle" font-size="12" fill="#92400e">eth1&#8211;eth3 зарезервированы, использовать нельзя</text>
</svg>
