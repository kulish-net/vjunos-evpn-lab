system {
    host-name leaf1;
    root-authentication {
        encrypted-password "$6$9YSzwiCD$ZiMI1N.5fcWCe5fH8hZz/FtISY4K8QKjv9p0w6Hkyct71ke1bn3OQQk0oi7/l5Sn8yP1CClO9CeGSMpNQcFjT/"; ## admin@123 - lab only
    }
    login {
        user admin {
            uid 500;
            class superuser;
            authentication {
                encrypted-password "$6$9YSzwiCD$ZiMI1N.5fcWCe5fH8hZz/FtISY4K8QKjv9p0w6Hkyct71ke1bn3OQQk0oi7/l5Sn8yP1CClO9CeGSMpNQcFjT/"; ## SECRET-DATA
            }
        }
    }
    management-instance;
    syslog {
        file messages {
            any notice;
            authorization info;
        }
    }
    services {
        netconf {
            ssh;
        }
        ssh {
            root-login allow;
        }
    }
}
interfaces {
    /* underlay link to leaf2 - Linux side eth4 */
    et-0/0/0 {
        unit 0 {
            family inet {
                address 10.255.0.0/31;
            }
        }
    }
    /* access port towards h1 - Linux side eth5, host sends VLAN 10 tagged */
    et-0/0/1 {
        flexible-vlan-tagging;
        encapsulation extended-vlan-bridge;
        unit 10 {
            vlan-id 10;
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 10.0.0.1/32;
            }
        }
    }
    re0:mgmt-0 {
        unit 0 {
            family inet {
                address FXP0ADDR;
            }
        }
    }
}
routing-options {
    router-id 10.0.0.1;
    autonomous-system 65001;
}
forwarding-options {
    /* MANDATORY on cJunosEvolved: without it the egress VTEP silently drops
       decapsulated tunnel traffic. The control plane looks perfect. */
    tunnel-termination;
}
policy-options {
    policy-statement adv-lo {
        from interface lo0.0;
        then accept;
    }
}
protocols {
    bgp {
        /* underlay: single hop over the direct link, carries lo0/32 */
        group underlay {
            type external;
            family inet {
                unicast;
            }
            export adv-lo;
            peer-as 65002;
            neighbor 10.255.0.1;
        }
        /* overlay: lo0 to lo0, carries EVPN routes */
        group overlay {
            type external;
            multihop {
                ttl 5;
            }
            local-address 10.0.0.1;
            family evpn {
                signaling;
            }
            peer-as 65002;
            neighbor 10.0.0.2;
        }
    }
}
routing-instances {
    MACVRF1 {
        instance-type mac-vrf;
        service-type vlan-based;
        protocols {
            evpn {
                encapsulation vxlan;
            }
        }
        vtep-source-interface lo0.0;
        route-distinguisher 10.0.0.1:10;
        vrf-target target:65000:10;
        vlans {
            v10 {
                vlan-id 10;
                interface et-0/0/1.10;
                vxlan {
                    vni 10010;
                }
            }
        }
    }
}
